name: NextHire Production SLA & Anomaly Scanner

on:
  schedule:
    # Executes every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows authorized manual execution from the GitHub Actions console

concurrency:
  group: nexthire-production-sla-scheduler
  cancel-in-progress: false

jobs:
  run-sla-scanner:
    name: Execute SLA & Anomaly Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger SLA & Operational Health Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT_URL: https://www.nexthire.cloud/api/jobs/sla-check
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub Actions Repository Secrets."
            exit 1
          fi

          echo "Triggering NextHire production SLA scanner at $(date -u +'%Y-%m-%dT%H:%M:%SZ')..."

          HTTP_RESPONSE=$(curl -s -L --max-redirs 3 -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: NextHire-GitHub-Actions-Scheduler/1.0" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ SLA & Anomaly scanner executed successfully."
            exit 0
          else
            echo "::error::SLA scanner failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
